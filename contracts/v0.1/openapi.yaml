          - knowledge
          - project
        criterion_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          minItems: 1
          maxItems: 30
        grader:
          type: string
          enum:
          - answer_key_v1
          - table_result_v1
          - evidence_match_v1
        input_asset_ids:
          type: array
          items: *id001
          minItems: 0
          maxItems: 20
        expected:
          type: object
          minProperties: 1
        weight:
          type: number
          exclusiveMinimum: 0
      required:
      - id
      - component
      - criterion_ids
      - grader
      - input_asset_ids
      - expected
      - weight
      allOf:
      - if:
          properties:
            grader:
              const: answer_key_v1
        then:
          properties:
            expected:
              type: object
              additionalProperties: false
              properties:
                option_id:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
              - option_id
      - if:
          properties:
            grader:
              const: table_result_v1
        then:
          properties:
            expected:
              type: object
              additionalProperties: false
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type:
                      - string
                      - number
                      - boolean
                      - 'null'
                  minItems: 0
                  maxItems: 1000
                sort_by:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 80
                  minItems: 0
                  maxItems: 10
                numeric_tolerance:
                  type: number
                  minimum: 0
              required:
              - rows
              - sort_by
              - numeric_tolerance
      - if:
          properties:
            grader:
              const: evidence_match_v1
        then:
          properties:
            expected:
              type: object
              additionalProperties: false
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      question_id:
                        type: string
                        minLength: 1
                        maxLength: 80
                      selected_evidence_ids:
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 80
                        minItems: 0
                        maxItems: 10
                      insufficient_evidence: *id010
                    required:
                    - question_id
                    - selected_evidence_ids
                    - insufficient_evidence
                  minItems: 1
                  maxItems: 20
              required:
              - answers
